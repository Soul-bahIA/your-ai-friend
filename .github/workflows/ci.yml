name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # --- Application web (Vite + React, frontend/) ---------------------------------
  frontend:
    name: Frontend (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - name: Typage (tsc, config de l'application)
        run: npx tsc --noEmit -p tsconfig.app.json
      - run: npm test
      - run: npm run build

  # --- Console de test du backend (backend/console) --------------------------------
  console:
    name: Console de test (backend/console)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/console/package-lock.json
      - run: npm ci
      # `build` = tsc --noEmit && vite build
      - run: npm run build

  # --- Catalogue d'outils unique (LOT 2) ----------------------------------------------
  # Source : agent/skills/manifests.py. shared/tools/catalog.json et ses copies node-api
  # (src/generated/) et python-ia (app/generated/) doivent être régénérés
  # (`python scripts/gen_catalog.py`) et versionnés : --check vaut 0 si tout est à jour,
  # 1 en cas de dérive (diff affiché), 2 si les manifestes ou le schéma sont invalides.
  # Bibliothèque standard uniquement (aucune dépendance de l'agent requise).
  catalog:
    name: Catalogue d'outils (gen_catalog --check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Manifestes → catalogue généré à jour (shared/tools + copies des services)
        run: python scripts/gen_catalog.py --check

  # --- API Node (Fastify / TypeScript) ---------------------------------------------
  node-api:
    name: Backend node-api
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/node-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/node-api/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      # Build compilé (T49) : exécuté dès que le script `build` existe.
      - run: npm run build --if-present

  # --- Service IA (FastAPI) — venv dédié (T34) --------------------------------------
  python-ia:
    name: Backend python-ia (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/python-ia/requirements*.txt
      - name: Venv + requirements (+ requirements-dev.txt)
        run: PYTHON=python bash scripts/setup_venvs.sh python-ia
      - name: Compilation (erreurs de syntaxe)
        working-directory: backend/python-ia
        run: .venv/bin/python -m compileall -q app
      - name: Tests
        working-directory: backend/python-ia
        run: .venv/bin/python -m pytest tests -q

  # --- Agent local (worker Python) — runner Windows -----------------------------
  # pyautogui, pygetwindow, mss… exigent une session Windows : le runner
  # windows-latest les installe et les importe réellement. SOULBAH_NO_DOTENV=1 :
  # les tests ne doivent jamais lire un agent/.env réel (T53).
  agent:
    name: Agent local (Windows)
    runs-on: windows-latest
    env:
      SOULBAH_NO_DOTENV: "1"
      PYTHONUTF8: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: agent/requirements*.txt
      - name: Venv + requirements (+ requirements-dev.txt)
        run: PYTHON=python bash scripts/setup_venvs.sh agent
      - name: Compilation (erreurs de syntaxe)
        run: agent/.venv/Scripts/python -m compileall -q -x '(__pycache__|\.venv)' agent
      - name: Tests
        run: agent/.venv/Scripts/python -m pytest agent/tests -q

  # --- Base de données : migrations ×2 + assertions (pgvector réel) -------------
  # Le stub scripts/ci/auth_stub.sql reproduit auth.users / auth.uid() / rôles /
  # publication Realtime. psql et pg_dump sont ceux du conteneur (même version).
  db:
    name: Base (migrations x2, schéma, policies)
    runs-on: ubuntu-latest
    services:
      postgres:
        # À ÉPINGLER sur la version MAJEURE du Postgres Supabase dès qu'elle est connue
        # (`SHOW server_version;` juste après la reprise du projet — voir
        # docs/SUPABASE_REPRISE.md). pg17 est une hypothèse provisoire.
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: RESTAURATION_BASE.sql à jour
        run: |
          bash scripts/build_restore_sql.sh
          git diff --exit-code -- RESTAURATION_BASE.sql
      - name: Droits soulbah_api ⊇ SQL de node-api (inventaire statique, T54)
        run: python3 scripts/ci/check_api_grants.py
      # --checks : schema_checks.sql, post_restore_checks.sql et api_role_checks.sql
      # (rôle soulbah_api créé avec scripts/sql/soulbah_api_grants.sql, puis annulé).
      - name: Migrations ×2, comparaison de schéma, assertions
        env:
          PSQL: docker exec -i ${{ job.services.postgres.id }} psql -U postgres -d postgres
          PG_DUMP: docker exec ${{ job.services.postgres.id }} pg_dump -U postgres -d postgres
        run: bash scripts/ci/apply_migrations.sh --checks

  # --- Scripts d'exploitation : sauvegardes (S30, S19) -------------------------------
  # Postgres 16 + client 16 du runner (pg_dump doit être ≥ serveur). Le rôle de test a un
  # « + » dans son mot de passe (authentification scram réelle) ; le dump doit garder les
  # droits (ACL de has_role).
  scripts:
    name: Scripts (sauvegardes bash + PowerShell)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Client PostgreSQL 16
        run: |
          command -v pg_dump >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q postgresql-client; }
          pg_dump --version
      - name: Migrations sur la base jetable + rôle de sauvegarde (mot de passe avec « + »)
        run: |
          PG_DUMP=none bash scripts/ci/apply_migrations.sh
          psql -X -v ON_ERROR_STOP=1 -c "CREATE ROLE backup_user LOGIN SUPERUSER PASSWORD 'a+b9xQ'"
      - name: backup_db.sh (décodage d'URL, refus du dump en clair, droits conservés)
        env:
          BACKUP_TEST_DATABASE_URL: postgresql://backup_user:a+b9xQ@127.0.0.1:5432/postgres?sslmode=disable
        run: env -u PGPASSWORD bash scripts/ci/test_backup_db.sh
      # backup_db.ps1 cible Windows : ici, refus du dump en clair seulement (l'intégration
      # se lance sous Windows avec BACKUP_TEST_DATABASE_URL, voir l'en-tête du test).
      - name: backup_db.ps1 (pwsh, refus du dump en clair)
        run: pwsh -NoProfile -File scripts/ci/test_backup_db.ps1

  # --- Compose : syntaxe, profils, variables transmises -----------------------------
  compose:
    name: docker compose (config)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Config par défaut (sans rust-compute)
        run: docker compose -f backend/docker-compose.yml config --quiet
      - name: Config avec le profil demo (rust-compute)
        run: docker compose -f backend/docker-compose.yml --profile demo config --quiet
      - name: Variables documentées et lues → transmises aux services (T26)
        run: |
          docker compose -f backend/docker-compose.yml config --format json > "$RUNNER_TEMP/compose.json"
          python3 scripts/ci/check_compose_env.py --compose-json "$RUNNER_TEMP/compose.json"

  # --- Images Docker (T35) : construites réellement ---------------------------------
  docker-build:
    name: docker compose build (images)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build python-ia, node-api, console
        run: docker compose -f backend/docker-compose.yml build
      # Démo Rust gelée (T50, profil demo) : informatif tant que Cargo.lock n'est pas versionné.
      - name: Build rust-compute (profil demo, non bloquant)
        continue-on-error: true
        run: docker compose -f backend/docker-compose.yml --profile demo build rust-compute

  # --- Démo Rust : compilation (T35, T50), non bloquante ------------------------------
  # Sans Cargo.lock versionné, le job en génère un, compile en --locked et le publie en
  # artefact « rust-compute-Cargo.lock » : le récupérer et le committer (T50).
  rust:
    name: rust-compute (cargo check, non bloquant)
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: backend/rust-compute
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain stable
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Cargo.lock
        run: |
          if [ -f Cargo.lock ]; then
            echo "Cargo.lock versionné : build reproductible."
          else
            cargo generate-lockfile
            echo "::warning::backend/rust-compute/Cargo.lock absent (T50) : généré pour ce run, à committer (artefact rust-compute-Cargo.lock)."
          fi
      - run: cargo check --locked --all-targets
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rust-compute-Cargo.lock
          path: backend/rust-compute/Cargo.lock
          if-no-files-found: ignore

  # --- Sécurité : dépendances de production + secrets ------------------------------
  security:
    name: Sécurité (npm audit, pip-audit, gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # gitleaks analyse tout l'historique
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: npm audit (prod) — frontend
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
      - name: npm audit (prod) — node-api
        working-directory: backend/node-api
        run: npm audit --omit=dev --audit-level=high
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pip-audit==2.7.3
      - name: pip-audit (prod) — python-ia
        run: pip-audit -r backend/python-ia/requirements.txt
      - name: pip-audit (prod) — agent
        run: pip-audit -r agent/requirements.txt
      - name: pip-audit (dépendances de dev, non bloquant)
        continue-on-error: true
        run: |
          rc=0
          for f in backend/python-ia/requirements-dev.txt agent/requirements-dev.txt; do
            if [ -f "$f" ]; then pip-audit -r "$f" || rc=1; fi
          done
          exit $rc
      - name: gitleaks (historique git complet)
        env:
          GITLEAKS_VERSION: 8.21.2
        run: |
          curl -sSfL -o /tmp/gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          # .github/.gitleaksignore : uniquement la clé anon Supabase historique (S33).
          /tmp/gitleaks git . --no-banner --redact --gitleaks-ignore-path .github/.gitleaksignore
