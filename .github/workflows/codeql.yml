name: CodeQL

# Analyse statique de sécurité (T35) : JavaScript/TypeScript (frontend, node-api, console)
# et Python (python-ia, agent). Aucune compilation nécessaire (build-mode: none).
# Résultats : onglet Security → Code scanning. Sur un dépôt privé, l'envoi des résultats
# exige GitHub Advanced Security (sinon l'étape « analyze » échoue à l'upload).

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"   # chaque lundi : nouvelles requêtes CodeQL sur le code inchangé

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
          config: |
            paths-ignore:
              - "**/node_modules/**"
              - "**/dist/**"
              - "**/.venv/**"
              - RESTAURATION_BASE.sql
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
