name: soulbah-backend

# Orchestration complète de l'architecture polyglotte.
# Lance : PostgreSQL + Rust (calculs) + Python (IA) + Node (API principale).
# Démarrage : `docker compose up --build`

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-soulbah}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-soulbah}
      POSTGRES_DB: ${POSTGRES_DB:-soulbah}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-soulbah}"]
      interval: 5s
      timeout: 3s
      retries: 10

  rust-compute:
    build: ./rust-compute
    ports:
      - "8080:8080"

  python-ia:
    build: ./python-ia
    environment:
      RUST_SERVICE_URL: http://rust-compute:8080
      # Génération via Claude (Anthropic)
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-4-8}
    ports:
      - "8000:8000"
    depends_on:
      rust-compute:
        condition: service_started

  node-api:
    build: ./node-api
    environment:
      PORT: 3000
      HOST: 0.0.0.0
      # Après migration : pointez DATABASE_URL vers le Postgres de Supabase (SSL requis).
      # Par défaut, le Postgres local (démo /api/analyze).
      DATABASE_URL: ${DATABASE_URL:-postgres://${POSTGRES_USER:-soulbah}:${POSTGRES_PASSWORD:-soulbah}@postgres:5432/${POSTGRES_DB:-soulbah}}
      DATABASE_SSL: ${DATABASE_SSL:-false}
      # Auth Supabase (vérification des JWT)
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
      # Chat via OpenAI (ChatGPT)
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_URL: ${OPENAI_URL:-https://api.openai.com/v1/chat/completions}
      CHAT_MODEL: ${CHAT_MODEL:-gpt-4o}
      IA_SERVICE_URL: http://python-ia:8000
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      python-ia:
        condition: service_started

  # Console web React/TypeScript (équivalent web du client Flutter).
  # Le contexte pointe vers ../frontend, sibling du dossier backend.
  frontend:
    build:
      context: ../frontend
      args:
        # VITE_API_URL est figée au build : le navigateur appelle l'hôte, pas le réseau docker.
        VITE_API_URL: http://localhost:3000
    ports:
      - "5173:80"
    depends_on:
      - node-api

volumes:
  pgdata:
