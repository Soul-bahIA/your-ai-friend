name: soulbah-backend

# Orchestration du backend : PostgreSQL (démo locale) + python-ia + node-api + console de test.
# Démarrage : `docker compose up --build`
# Avec la démo Rust (facultative, hors V2) : `docker compose --profile demo up --build`
#
# Exposition (S18) : TOUS les ports publiés sont liés à 127.0.0.1 — rien n'est joignable
# depuis le réseau local. node-api écoute sur 0.0.0.0 DANS son conteneur (obligatoire
# pour la publication de port), mais l'hôte ne publie que sur la boucle locale.
# python-ia et rust-compute restent internes au réseau docker (aucun port publié).
#
# Environnement (contrat LOT 1 §1) : SOULBAH_ENV = dev | test | staging | production
# (défaut dev). Hors dev/test, node-api et python-ia REFUSENT de démarrer sans
# IA_SERVICE_TOKEN (et node-api sans PG_SSL_CA quand DATABASE_SSL=true).

x-llm-env: &llm-env
  # Fournisseurs d'IA — un fournisseur est actif dès que sa clé est renseignée.
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-4-8}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash}
  MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
  MISTRAL_MODEL: ${MISTRAL_MODEL:-mistral-large-latest}
  DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
  DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
  XAI_API_KEY: ${XAI_API_KEY:-}
  XAI_MODEL: ${XAI_MODEL:-grok-2-latest}
  QWEN_API_KEY: ${QWEN_API_KEY:-}
  QWEN_MODEL: ${QWEN_MODEL:-qwen-max}
  LOCAL_LLM_URL: ${LOCAL_LLM_URL:-}
  LOCAL_LLM_MODEL: ${LOCAL_LLM_MODEL:-llama3.1}
  LOCAL_LLM_KEY: ${LOCAL_LLM_KEY:-}

x-soulbah-env: &soulbah-env
  # dev | test | staging | production — hors dev/test, IA_SERVICE_TOKEN est obligatoire.
  SOULBAH_ENV: ${SOULBAH_ENV:-dev}
  # Jeton partagé node-api → python-ia (en-tête x-ia-token). Même valeur des deux côtés.
  IA_SERVICE_TOKEN: ${IA_SERVICE_TOKEN:-}
  # Fournisseurs qu'un client peut imposer (champ `provider`), lu par node-api ET python-ia :
  # même valeur des deux côtés. Vide = aucune surcharge (tout `provider` fourni → 400).
  LLM_ALLOWED_OVERRIDES: ${LLM_ALLOWED_OVERRIDES:-}

# Routeur de modèles de python-ia (LOT 1, cf. .env.example). Vide = défaut du routeur ;
# les valeurs numériques lues sans repli dans le code reçoivent leur défaut documenté
# (une chaîne vide ferait échouer le démarrage).
# Contrôle CI : scripts/ci/check_compose_env.py (toute variable documentée dans
# .env.example et lue par un service doit lui être transmise ici).
x-llm-router-env: &llm-router-env
  LLM_MODEL_PLANNER: ${LLM_MODEL_PLANNER:-}
  LLM_MODEL_EVALUATOR: ${LLM_MODEL_EVALUATOR:-}
  LLM_MODEL_VISION: ${LLM_MODEL_VISION:-}
  LLM_MODEL_CHEAP: ${LLM_MODEL_CHEAP:-}
  LLM_EFFORT_PLANNER: ${LLM_EFFORT_PLANNER:-}
  LLM_EFFORT_EVALUATOR: ${LLM_EFFORT_EVALUATOR:-}
  LLM_EFFORT_VISION: ${LLM_EFFORT_VISION:-}
  LLM_EFFORT_CHEAP: ${LLM_EFFORT_CHEAP:-}
  LLM_EFFORT_DEFAULT: ${LLM_EFFORT_DEFAULT:-}
  LLM_FALLBACK_ORDER: ${LLM_FALLBACK_ORDER:-}
  LLM_MAX_HOPS: ${LLM_MAX_HOPS:-}
  LLM_CB_THRESHOLD: ${LLM_CB_THRESHOLD:-}
  LLM_CB_COOLDOWN_S: ${LLM_CB_COOLDOWN_S:-}
  # JSON, p. ex. {"openai:gpt-4o": {"vision": true}} (corrige un faux positif/négatif vision).
  LLM_CAPABILITIES: ${LLM_CAPABILITIES:-}
  LLM_BUDGET_S: ${LLM_BUDGET_S:-}
  LLM_LONG_BUDGET_S: ${LLM_LONG_BUDGET_S:-}
  LLM_LONG_TIMEOUT_S: ${LLM_LONG_TIMEOUT_S:-}
  LLM_TIMEOUT_S: ${LLM_TIMEOUT_S:-100}
  LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-1}
  LLM_THINKING_MIN_MAX_TOKENS: ${LLM_THINKING_MIN_MAX_TOKENS:-16000}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-soulbah}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-soulbah}
      POSTGRES_DB: ${POSTGRES_DB:-soulbah}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-soulbah}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Démo Rust (T50) : gelée, aucun rôle en V2 (audit §9.2). Démarrée UNIQUEMENT avec
  # `--profile demo`. Sans elle, python-ia /infer échoue proprement (service absent).
  rust-compute:
    build: ./rust-compute
    profiles: ["demo"]
    restart: unless-stopped
    # Interne uniquement (appelé par python-ia via le réseau docker).
    expose:
      - "8080"

  python-ia:
    build: ./python-ia
    restart: unless-stopped
    environment:
      <<: [*llm-env, *soulbah-env, *llm-router-env]
      RUST_SERVICE_URL: http://rust-compute:8080
      LLM_DEFAULT_PROVIDER: ${LLM_DEFAULT_PROVIDER:-}
      LLM_ROUTING: ${LLM_ROUTING:-}
      # Fournisseur factice (LOT 3) : dev/test uniquement (refus de démarrer sinon).
      LLM_FAKE_PROVIDER: ${LLM_FAKE_PROVIDER:-}
      TTS_MODEL: ${TTS_MODEL:-tts-1}
      TTS_VOICE: ${TTS_VOICE:-alloy}
      OPENAI_TTS_URL: ${OPENAI_TTS_URL:-https://api.openai.com/v1/audio/speech}
      VIDEO_TTS_CONCURRENCY: ${VIDEO_TTS_CONCURRENCY:-3}
      IA_MAX_BODY_BYTES: ${IA_MAX_BODY_BYTES:-41943040}
      # Volume média partagé : python-ia ÉCRIT (dossier possédé par l'utilisateur non-root
      # de l'image, uid 10001), node-api le monte en lecture seule et le sert sous /media/.
      MEDIA_DIR: /app/media
    volumes:
      - media:/app/media
    # Interne uniquement (pas de port publié) : seul node-api l'appelle, avec x-ia-token.
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    # Pas de depends_on rust-compute : il n'est lancé qu'avec le profil `demo`.

  node-api:
    build: ./node-api
    restart: unless-stopped
    environment:
      <<: [*llm-env, *soulbah-env]
      PORT: 3000
      # 0.0.0.0 DANS le conteneur uniquement ; la publication côté hôte est sur 127.0.0.1.
      HOST: 0.0.0.0
      # Origines web autorisées (CORS), séparées par des virgules.
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080,http://localhost:5173}
      # Postgres de Supabase (SSL) ; par défaut le Postgres local (démo /api/analyze).
      DATABASE_URL: ${DATABASE_URL:-postgres://${POSTGRES_USER:-soulbah}:${POSTGRES_PASSWORD:-soulbah}@postgres:5432/${POSTGRES_DB:-soulbah}}
      DATABASE_SSL: ${DATABASE_SSL:-false}
      # Vérification TLS stricte : chemin DANS le conteneur (monter le fichier CA en volume).
      PG_SSL_CA: ${PG_SSL_CA:-}
      PG_STATEMENT_TIMEOUT_MS: ${PG_STATEMENT_TIMEOUT_MS:-30000}
      # Auth Supabase (vérification des JWT)
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
      # Chat streaming (famille compatible OpenAI) — cf. .env.example
      CHAT_PROVIDER: ${CHAT_PROVIDER:-}
      CHAT_MODEL: ${CHAT_MODEL:-}
      OPENAI_URL: ${OPENAI_URL:-https://api.openai.com/v1/chat/completions}
      # Embeddings (RAG)
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      EMBEDDING_URL: ${EMBEDDING_URL:-https://api.openai.com/v1/embeddings}
      # Recherche web
      WEB_SEARCH_PROVIDER: ${WEB_SEARCH_PROVIDER:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      SERPER_API_KEY: ${SERPER_API_KEY:-}
      BRAVE_API_KEY: ${BRAVE_API_KEY:-}
      KNOWLEDGE_STORE_PROVIDER: ${KNOWLEDGE_STORE_PROVIDER:-supabase}
      # Agent local / maintenance / limitation de débit
      AGENT_TASK_STALE_SECONDS: ${AGENT_TASK_STALE_SECONDS:-180}
      REAPER_INTERVAL_SECONDS: ${REAPER_INTERVAL_SECONDS:-60}
      STALE_GENERATION_MINUTES: ${STALE_GENERATION_MINUTES:-30}
      # Volume média en lecture seule ici : la purge est ignorée côté node-api.
      MEDIA_RETENTION_DAYS: ${MEDIA_RETENTION_DAYS:-30}
      # Proxy de confiance (IP réelle pour la limitation de débit) ; vide = connexion directe.
      TRUST_PROXY: ${TRUST_PROXY:-}
      RATE_LIMIT_GLOBAL: ${RATE_LIMIT_GLOBAL:-300}
      RATE_LIMIT_AGENT: ${RATE_LIMIT_AGENT:-1200}
      RATE_LIMIT_EXPENSIVE: ${RATE_LIMIT_EXPENSIVE:-20}
      IA_SERVICE_URL: http://python-ia:8000
      MEDIA_DIR: /data/media
    volumes:
      - media:/data/media:ro
    ports:
      - "127.0.0.1:${NODE_API_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      python-ia:
        condition: service_healthy

  # Console de test du backend (backend/console) — ce n'est PAS l'application web
  # (frontend/, lancée à part avec `npm run dev`).
  console:
    build:
      context: ./console
      args:
        # VITE_API_URL est figée au build : le navigateur appelle l'hôte, pas le réseau docker.
        VITE_API_URL: http://localhost:${NODE_API_PORT:-3000}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${CONSOLE_PORT:-5173}:80"
    depends_on:
      - node-api

volumes:
  pgdata:
  media:
